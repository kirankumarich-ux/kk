<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#134074"/>
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb15b"/>
      <stop offset="100%" stop-color="#b08630"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#stemGrad)"/>
  
  <!-- Subtle Grid Background -->
  <path d="M0,40 L400,40 M0,80 L400,80 M0,120 L400,120 M0,160 L400,160 M0,200 L400,200" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <path d="M50,0 L50,240 M100,0 L100,240 M150,0 L150,240 M200,0 L200,240 M250,0 L250,240 M300,0 L300,240 M350,0 L350,240" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Science Beaker / Flask (Left) -->
  <g transform="translate(45, 50)" stroke="#dfb15b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Liquid -->
    <path d="M 15 85 L 65 85 L 55 50 L 25 50 Z" fill="rgba(223, 177, 91, 0.25)" stroke="none"/>
    <!-- Flask Outline -->
    <path d="M 32 10 L 48 10 M 35 10 L 35 30 L 10 90 A 8 8 0 0 0 18 100 L 62 100 A 8 8 0 0 0 70 90 L 45 30 L 45 10" stroke="#ffffff" stroke-width="3.5"/>
    <!-- Bubbles -->
    <circle cx="28" cy="72" r="3" fill="#dfb15b" stroke="none"/>
    <circle cx="50" cy="65" r="4.5" fill="#dfb15b" stroke="none"/>
    <circle cx="38" cy="40" r="2.5" fill="#dfb15b" stroke="none"/>
    <circle cx="43" cy="22" r="3" fill="#dfb15b" stroke="none"/>
  </g>

  <!-- Atom Model (Center-Right) -->
  <g transform="translate(230, 115)">
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="10" fill="url(#accentGold)"/>
    <circle cx="-5" cy="-3" r="5" fill="#ffffff" opacity="0.8"/>
    
    <!-- Orbits -->
    <ellipse rx="65" ry="24" fill="none" stroke="#8da9c4" stroke-width="2" transform="rotate(30)"/>
    <ellipse rx="65" ry="24" fill="none" stroke="#8da9c4" stroke-width="2" transform="rotate(-30)"/>
    <ellipse rx="65" ry="24" fill="none" stroke="#ffffff" stroke-width="2" transform="rotate(90)" opacity="0.6"/>

    <!-- Electrons -->
    <circle cx="56" cy="32" r="5.5" fill="#dfb15b"/>
    <circle cx="-56" cy="-32" r="5.5" fill="#dfb15b"/>
    <circle cx="-32" cy="56" r="5.5" fill="#ffffff"/>
    <circle cx="0" cy="-65" r="5.5" fill="#ffffff"/>
  </g>
  
  <!-- DNA Double Helix / Technology element (Bottom Left/Top Right) -->
  <g transform="translate(320, 20)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2">
    <!-- Coding Tag -->
    <path d="M 15 15 L 0 25 L 15 35 M 40 15 L 55 25 L 40 35 M 32 10 L 22 40" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Gear Wheels / Engineering element -->
  <g transform="translate(130, 160)" stroke="#ffffff" stroke-width="2.5" fill="none">
    <!-- Larger gear -->
    <circle cx="30" cy="30" r="22"/>
    <path d="M30,3 L30,8 M30,52 L30,57 M3,30 L8,30 M52,30 L57,30 M11,11 L15,15 M45,45 L49,49 M11,49 L15,45 M45,11 L49,15"/>
    <circle cx="30" cy="30" r="7" fill="url(#stemGrad)"/>
    
    <!-- Smaller gear -->
    <g transform="translate(48, -12)" stroke="#dfb15b" stroke-width="2">
      <circle cx="15" cy="15" r="12"/>
      <path d="M15,0 L15,3 M15,27 L15,30 M0,15 L3,15 M27,15 L30,15"/>
      <circle cx="15" cy="15" r="4" fill="url(#stemGrad)"/>
    </g>
  </g>
</svg>
