<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="artsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#134074"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb15b"/>
      <stop offset="100%" stop-color="#b08630"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#artsGrad)"/>
  
  <!-- Grid lines -->
  <path d="M0,40 L400,40 M0,80 L400,80 M0,120 L400,120 M0,160 L400,160 M0,200 L400,200" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <path d="M50,0 L50,240 M100,0 L100,240 M150,0 L150,240 M200,0 L200,240 M250,0 L250,240 M300,0 L300,240 M350,0 L350,240" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Classical Pillar/Column (Left side - representing History and Philosophy) -->
  <g transform="translate(60, 45)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Capital -->
    <path d="M 10 20 L 70 20 M 15 28 L 65 28" stroke-width="4"/>
    <path d="M 17 28 Q 10 28 15 38 L 25 38 Q 30 38 25 28 Q 20 28 25 38 M 63 28 Q 70 28 65 38 L 55 38 Q 50 38 55 28 Q 60 28 55 38" stroke="#dfb15b" stroke-width="2.5"/>
    <!-- Shaft (Columns) -->
    <rect x="25" y="38" width="30" height="90" fill="rgba(255, 255, 255, 0.05)"/>
    <line x1="32" y1="42" x2="32" y2="124" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2"/>
    <line x1="40" y1="42" x2="40" y2="124" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2"/>
    <line x1="48" y1="42" x2="48" y2="124" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2"/>
    <!-- Base -->
    <path d="M 20 128 L 60 128 M 15 135 L 65 135" stroke-width="4"/>
  </g>

  <!-- Open Book & Quill (Center-Right - representing Literature, Writing, and Languages) -->
  <g transform="translate(200, 75)">
    <!-- Book Pages -->
    <path d="M 10 70 Q 55 60 90 75 L 90 15 Q 55 0 10 10 Z" fill="rgba(255, 255, 255, 0.05)" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 170 70 Q 125 60 90 75 L 90 15 Q 125 0 170 10 Z" fill="rgba(255, 255, 255, 0.05)" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Spine lines -->
    <path d="M 90 15 L 90 76" stroke="#dfb15b" stroke-width="3"/>
    
    <!-- Text Lines (Left Page) -->
    <line x1="25" y1="30" x2="75" y2="22" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2.5"/>
    <line x1="25" y1="42" x2="75" y2="34" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2.5"/>
    <line x1="25" y1="54" x2="75" y2="46" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2.5"/>

    <!-- Text Lines (Right Page) -->
    <line x1="105" y1="22" x2="155" y2="30" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2.5"/>
    <line x1="105" y1="34" x2="155" y2="42" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2.5"/>
    <line x1="105" y1="46" x2="155" y2="54" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2.5"/>
    
    <!-- Feather Quill (Drawing overlapping the book) -->
    <g transform="translate(130, -35) rotate(-25)" stroke="#dfb15b" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M 0 80 Q 25 40 10 0" stroke="#dfb15b" stroke-width="3"/>
      <!-- Vanes of the feather -->
      <path d="M 4 45 Q 22 30 20 20"/>
      <path d="M 6 35 Q 24 20 20 10"/>
      <path d="M 8 25 Q 24 10 18 0"/>
      <path d="M 2 55 Q 18 45 15 35"/>
      <!-- Nib -->
      <path d="M 0 80 L -3 87 L 2 83" fill="#dfb15b"/>
    </g>
  </g>

  <!-- Stylized Globe / Longitude-Latitude Lines (Top Left - representing Geography and Global Studies) -->
  <g transform="translate(300, 35)" stroke="rgba(223, 177, 91, 0.4)" stroke-width="2" fill="none">
    <circle cx="40" cy="40" r="30"/>
    <ellipse cx="40" cy="40" rx="30" ry="10"/>
    <ellipse cx="40" cy="40" rx="10" ry="30"/>
    <line x1="10" y1="40" x2="70" y2="40"/>
    <line x1="40" y1="10" x2="40" y2="70"/>
    <!-- Stand -->
    <path d="M 40 70 A 33 33 0 0 1 73 85 M 40 70 L 40 92 M 25 92 L 55 92" stroke="#ffffff" stroke-width="2.5"/>
  </g>
</svg>
